<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCA Computer Department</title>
    <style>
        /* General Page Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        /* Modern Navigation Menu */
        nav {
            background-color: #2c3e50;
            padding: 15px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .nav-container {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .nav-container a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .nav-container a:hover {
            color: #3498db; /* Changes color to blue on hover */
        }

        /* Main Heading */
        h1 {
            font-family: "Georgia", serif;
            text-align: center;
            color: #333;
            margin-top: 40px;
            margin-bottom: 30px;
        }

        /* Responsive Gallery Layout */
        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px; /* Perfect, automatic spacing on all sides */
            max-width: 1400px;
            margin: 0 auto 50px auto;
            padding: 0 20px;
        }

        /* Clean Image Styling */
        .gallery-container img {
            width: 400px;
            height: 400px;
            object-fit: cover; /* Prevents your images from looking squished */
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        /* Subtle interactive effect */
        .gallery-container img:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <!-- Navigation Menu -->
    <nav>
        <div class="nav-container">
            <a href="Home.html">About the Department</a>
            <a href="HOD.html">HOD Profile</a>
            <a href="Faculty.html">Faculty Details</a>
            <a href="MCA_Association.html">MCA Association Details</a>
            <a href="Gallery.html">Gallery</a>
        </div>
    </nav>

    <!-- Header Section -->
    <h1>MCA GALLERY</h1>

    <!-- Image Grid Container -->
    <div class="gallery-container">
        <img src="img1.jpeg" alt="MCA Gallery Image 1">
        <img src="img2.jpeg" alt="MCA Gallery Image 2">
        <img src="img3.jpeg" alt="MCA Gallery Image 3">
        <img src="img4.jpeg" alt="MCA Gallery Image 4">
        <img src="img5.jpeg" alt="MCA Gallery Image 5">
        <img src="img6.jpeg" alt="MCA Gallery Image 6">
        <img src="img7.jpeg" alt="MCA Gallery Image 7">
        <img src="img8.jpeg" alt="MCA Gallery Image 8">
    </div>

</body>
</html>
