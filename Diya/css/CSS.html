<!DOCTYPE html>
<html>
<head>
    <title>Three Types of CSS</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h2 {
            color: green;
            text-align: center;
        }

        .internal {
            background-color: lightyellow;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>CSS Types Demonstration</h1>

    <!-- Inline CSS -->
    <p style="color: red; font-size: 20px;">
        This paragraph uses Inline CSS.
    </p>

    <!-- Internal CSS -->
    <h2>This heading uses Internal CSS</h2>

    <p class="internal">
        This paragraph is styled using Internal CSS.
    </p>

    <!-- External CSS -->
    <h3>This heading uses External CSS</h3>

    <p class="external">
        This paragraph is styled using External CSS.
    </p>

</body>
</html>
